name: Pipeline for Product Add Microservice

on:
  push:
    branches:
      - QA
    paths:
      - 'product-add-service/**'
      - '.github/workflows/product-add-pipeline.yml'
  pull_request:
    branches: 
      - QA
    paths:
      - 'product-add-service/**'
      - '.github/workflows/product-add-pipeline.yml'

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build Docker image
        run: docker buildx build -t ${{ secrets.DOCKER_USERNAME }}/product-add-service:latest .

      - name: Push Docker image to Dockerhub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/product-add-service:latest

  deploy-to-ec2-instance:
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST_TEST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            echo "Pull, stop, and redeploy the Docker container"
            docker pull ${{ secrets.DOCKER_USERNAME }}/product-add-service:latest
            docker stop product-add-service|| true
            docker rm product-add-service || true
            docker run --restart always\
                       -e DATABASE_URL=${{ secrets.DATABASE_URL }} \
                       -e PORT=${{ secrets.PORT_ADD }} \
                       -e JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }} \
                       -d --name product-add-service \
                       -p ${{ secrets.PORT_ADD }}:${{ secrets.PORT_ADD }} ${{ secrets.DOCKER_USERNAME }}/product-add-service:latest