name: Pipeline for Product Find by Name Microservice

on:
  push:
    branches:
      - QA
    paths:
      - 'product_find_by_name_service/**'
      - '.github/workflows/product-find-by-name-pipeline.yml'
  pull_request:
    branches:
      - QA
    paths:
      - 'product_find_by_name_service/**'
      - '.github/workflows/product-find-by-name-pipeline.yml'

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Show current directory and files (debug)
        run: |
          pwd
          ls -R

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        working-directory: ./product_find_by_name_service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/product_find_by_name_service:latest .
        
      - name: Verify Docker image build
        run: |
          docker images ${{ secrets.DOCKER_USERNAME }}/product_find_by_name_service:latest

      - name: Push Docker image to DockerHub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/product_find_by_name_service:latest

  deploy-to-ec2-instance:
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST_TEST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            echo "Pull, stop, and redeploy the Docker container"
            
            # Verificar si la imagen está disponible antes de hacer pull
            docker images ${{ secrets.DOCKER_USERNAME }}/product_find_by_name_service:latest

            # Intentar hacer pull de la imagen
            docker pull ${{ secrets.DOCKER_USERNAME }}/product_find_by_name_service:latest

            # Detener y eliminar el contenedor si existe
            docker stop product_find_by_name_service || true
            docker rm product_find_by_name_service || true

            # Iniciar el nuevo contenedor
            docker run --restart always \
              -e DATABASE_URL=${{ secrets.DATABASE_URL }} \
              -e PORT=${{ secrets.PORT_FIN_BY_NAME }} \
              -e JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }} \
              -d --name product_find_by_name_service \
              -p ${{ secrets.PORT_FIN_BY_NAME }}:${{ secrets.PORT_FIN_BY_NAME }} \
              ${{ secrets.DOCKER_USERNAME }}/product_find_by_name_service:latest

      - name: Verify Docker container status
        run: |
          docker ps -a
          docker logs product_find_by_name_service
