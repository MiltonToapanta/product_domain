name: Pipeline for Product delete Microservice

on:
  push:
    branches:
      - Production
    paths:
      - 'product_delete_service/**'
      - '.github/workflows/product-delete-pipeline.yml'
  pull_request:
    branches:
      - Production
    paths:
      - 'product_delete_service/**'
      - '.github/workflows/product-delete-pipeline.yml'

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Show current directory and files (debug)
        run: |
          pwd
          ls -R

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        working-directory: ./product_delete_service
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/product_delete_service:latest .

      - name: Push Docker image to DockerHub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/product_delete_service:latest

  deploy-to-ec2-instance:
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST_TEST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            echo "Pull, stop, and redeploy the Docker container"
            docker pull ${{ secrets.DOCKER_USERNAME }}/product_delete_service:latest
            docker stop product_delete_service || true
            docker rm product_delete_service || true
            docker run --restart always \
              -e DATABASE_URL=${{ secrets.DATABASE_URL }} \
              -e PORT=${{ secrets.PORT_DELETE }} \
              -e JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }} \
              -d --name product_delete_service \
              -p ${{ secrets.PORT_DELETE }}:${{ secrets.PORT_DELETE }} \
              ${{ secrets.DOCKER_USERNAME }}/product_delete_service:latest
